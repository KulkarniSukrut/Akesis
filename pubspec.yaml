name: askesis
description: "A personal operating system for tracking, understanding, and improving life."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  # Core
  cupertino_icons: ^2.0.0

  # State Management
  flutter_riverpod: ^3.4.3
  riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7

  # Routing
  go_router: ^18.0.2

  # Backend / Database
  supabase_flutter: ^2.8.3

  # Local Storage
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^11.2.0

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1
  collection: ^1.19.0
  path_provider: ^2.1.5

  # Serialization
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # UI Components
  lucide_icons: ^0.257.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code Generation
  build_runner: ^2.4.15
  riverpod_generator: ^4.0.9
  freezed: ^4.0.2
  json_serializable: ^6.9.3

flutter:
  uses-material-design: true

